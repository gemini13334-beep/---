<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101923"><title>ОСОБЫЙ ОТДЕЛ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923;color:#edf0f1;font:14px system-ui,Arial;touch-action:none}button{cursor:pointer;font:inherit}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}#damageFlash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 38%,#bd2715ae 100%)}#hitMarker{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:800 28px Arial;color:#fff;opacity:0;pointer-events:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000b}#top{position:absolute;top:9px;left:50%;transform:translateX(-50%);padding:9px 18px;background:#14202de8;border-bottom:2px solid #d5a354;font-weight:800;white-space:nowrap;font-size:12px;letter-spacing:.6px}#objective{color:#edc17b}#stats{position:absolute;bottom:13px;left:150px;display:flex;gap:7px;font-size:20px;font-weight:900}#stats>div{padding:8px 13px;background:#132230dd;border-left:3px solid #d9a75b}#status{position:absolute;top:55px;left:50%;transform:translateX(-50%);color:#d9ac65;font-size:10px;letter-spacing:1px}#pause{position:absolute;right:13px;top:12px;background:#1c2d3ce8;border:1px solid #718390;color:#fff;padding:10px 14px;pointer-events:auto}#viewSwitch,#qualitySwitch{display:none}#weaponSwitch{position:absolute;right:14px;bottom:15px;background:#172634e8;border:1px solid #bd9258;color:#f7d5a4;padding:12px 15px;pointer-events:auto;font-size:12px;font-weight:800;max-width:190px}#stick{position:fixed;bottom:14px;left:18px;width:112px;height:112px;border:2px solid #c6d0d077;border-radius:50%;background:#182b3a99;touch-action:none}#knob{position:absolute;width:49px;height:49px;border-radius:50%;background:#c9d2d299;left:30px;top:30px}#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:stretch;padding:0;background:linear-gradient(90deg,#0c1720f8 0%,#132431f0 38%,#152735a0 58%,#15273513 100%);overflow:auto}#overlay[hidden]{display:none}#panel{width:100%;min-height:100%;display:flex;flex-direction:column;gap:0}#panel .shell{display:flex;flex-direction:column;min-height:100%;width:100%}#panel .menu-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #8494a02b;background:#0c1720b9}#panel .brand{font-weight:950;letter-spacing:2px;font-size:18px;color:#f1c17c}#panel .menu-meta{font-size:10px;color:#a9b7c3;letter-spacing:1px}#panel .menu-body{flex:1;display:flex;min-height:0}#panel .nav{width:160px;flex:none;padding:17px 9px;background:#0d1925bc;border-right:1px solid #ffffff17;display:flex;flex-direction:column;gap:6px}#panel button{border:1px solid #63758777;color:#e7edf1;background:#203342e0;padding:11px 13px;text-align:left;font-size:12px;font-weight:800}#panel button.primary{background:#d6a65e;color:#17232c;border-color:#d6a65e}#panel button.active{border-left:3px solid #e3b566;background:#324452}#panel .content{padding:20px clamp(18px,4vw,46px);flex:1;overflow:auto;max-width:60%;background:linear-gradient(90deg,#0d1b28bb,#10202b44)}#panel h1{font-size:clamp(22px,3.6vw,37px);letter-spacing:1px;color:#f4e8d4;margin:0 0 10px}#panel h2{font-size:14px;color:#e7b973;margin:15px 0 9px;letter-spacing:1px}#panel p{font-size:12px;color:#b8c7d1;line-height:1.55;max-width:570px}#panel .eyebrow{font-size:10px;color:#e3b66c;letter-spacing:2px;margin-bottom:8px}#panel .menu-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}#panel .menu-actions button{min-width:170px}#panel .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;max-width:680px}#panel .tile{background:#1d303dcf;border:1px solid #526779a6;padding:14px;min-height:80px}#panel .tile b{color:#f2d6a9}#panel .tile small{display:block;color:#b3c3ce;margin-top:9px}#panel .menu-foot{background:#0c1720b8;padding:9px 25px;border-top:1px solid #8494a02b;color:#8ea0ad;font-size:10px;letter-spacing:1px}@media(max-width:680px){#panel .nav{width:116px}#panel .nav button{font-size:10px;padding:9px 6px}#panel .content{max-width:70%;padding:12px 13px}#panel .menu-meta{display:none}#panel .tiles{grid-template-columns:repeat(2,minmax(105px,1fr))}}@media(max-height:420px){#panel .menu-head{height:43px}#panel .content{padding:12px 20px}#panel .nav{padding:8px;width:138px}#panel .tile{min-height:65px;padding:10px}#panel h1{font-size:24px}#stick{width:85px;height:85px}#knob{left:18px;top:18px}#stats{left:114px;font-size:16px}#panel .menu-foot{padding:5px 20px}}</style></head><body><canvas id="renderCanvas"></canvas><div id="damageFlash"></div><div id="hitMarker">✕</div><div id="hud"><div id="top"><span id="objective">ОПЕРАЦИЯ</span> · <span id="kills">0 / 12</span></div><div id="status">ЗАГРУЗКА BABYLON.JS</div><div id="stats"><div>✚ <span id="health">100</span></div></div><button id="pause" aria-label="Пауза">Ⅱ</button><button id="viewSwitch">КАМЕРА: ДАЛЬШЕ</button><button id="qualitySwitch">ГРАФИКА: СРЕДНЯЯ</button><button id="weaponSwitch"><span id="weaponName">MK-18 · АВТОМАТ</span> ↻</button></div><div id="stick"><div id="knob"></div></div><div id="overlay"><div id="panel"><h1>ЗАГРУЗКА 3D</h1></div></div><script src="./vendor/babylon.js"></script><script src="./texture-pack.js"></script><script src="./babylon-game.js"></script></body></html>
