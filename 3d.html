<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101923"><title>ОТПУСК — 3D PROTOTYPE</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#0b121b;color:#f4e6c7;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top,8px);left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}#hud span{background:#182633dc;border-top:3px solid #e5b96f;padding:9px 12px;font-weight:900;font-size:12px;min-width:75px;text-align:center}#stick{position:fixed;left:22px;bottom:35px;width:126px;height:126px;border:2px solid #b6cad488;border-radius:50%;background:#17293870;touch-action:none}#knob{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:#8ebac5b8;border:2px solid #d6efff}#dash{position:fixed;right:24px;bottom:55px;width:85px;height:85px;border-radius:50%;background:#70532bdc;border:2px solid #f4d095;color:#fff;font-weight:900}#msg{position:fixed;left:0;right:0;top:80px;text-align:center;font-size:13px;font-weight:bold;text-shadow:0 2px 6px #000;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101923;z-index:5;text-align:center;padding:30px}#loading a{color:#f4c477}</style></head><body><div id="loading">ЗАГРУЗКА 3D-ДВИЖКА…</div><div id="hud"><span id="hp">HP 100</span><span id="kills">0 / 12</span><span>3D / WEBGL</span><button id="pause3d" type="button" aria-label="Пауза" style="pointer-events:auto;background:#182633;color:#f4e6c7;border:1px solid #a8b7c3;padding:8px 12px;font-weight:900">Ⅱ</button></div><div id="msg">Зачисти помещение. Стрельба автоматическая.</div><div id="stick"><div id="knob"></div></div><button id="dash">РЫВОК</button><script>
(function(){
 const loading=document.getElementById('loading');let completed=false;
 function fail(reason){
  if(completed||!loading||!loading.isConnected)return;
  completed=true;
  loading.innerHTML='';
  const panel=document.createElement('div');
  panel.style.cssText='max-width:380px;padding:22px;border:1px solid #9eacb9;background:#172633;color:#f4e6c7;font:15px/1.5 Arial,sans-serif';
  const title=document.createElement('h2');title.textContent='НЕ УДАЛОСЬ ЗАПУСТИТЬ 3D';title.style.color='#ffcb86';
  const detail=document.createElement('p');detail.textContent=reason;
  const retry=document.createElement('button');retry.textContent='ПОВТОРИТЬ';retry.style.cssText='padding:12px;margin:8px;background:#dca35b;color:#111';retry.onclick=()=>location.reload();
  panel.append(title,detail,retry);loading.append(panel);
 }
 window.addEventListener('error',e=>fail('Ошибка JavaScript: '+(e.message||'неизвестная ошибка')));
 window.addEventListener('unhandledrejection',e=>fail('Ошибка загрузки: '+String(e.reason&&e.reason.message||e.reason||'модуль недоступен')));
 const watchdog=setTimeout(()=>fail('3D-движок не ответил за 12 секунд. Установи обновлённую APK или повтори запуск.'),12000);
 import('./game3d.js').then(()=>{completed=true;clearTimeout(watchdog)}).catch(e=>{clearTimeout(watchdog);fail('Не удалось загрузить 3D-модуль: '+(e&&e.message||e))});
})();
</script></body></html>
