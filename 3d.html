<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17242d"><title>ОТПУСК — TACTICAL 3D</title><style>
:root{--ink:#101820;--panel:#17242de8;--steel:#7d929e;--line:#8da0a866;--text:#e9e7de;--gold:#e6b65b;--blue:#7daac3;--danger:#dd6d63}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:var(--text);font-family:Arial,Helvetica,sans-serif;touch-action:none}canvas{display:block}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;text-shadow:0 2px 4px #000b}
#topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:0;background:#14212bdf;border:1px solid var(--line);box-shadow:0 4px 22px #0008;min-height:46px}
#topbar .team{font-size:22px;font-weight:900;padding:9px 17px;min-width:52px;text-align:center}#topbar .team.blue{color:#9cc5dd;background:#28495c88}#topbar .team.gold{color:#f4c46e;background:#57462b88}
#round{min-width:140px;text-align:center;padding:4px 12px;border-inline:1px solid var(--line)}#round .mini{font-size:9px;letter-spacing:2px;color:#a7b8c0}#round strong{display:block;font-size:17px;letter-spacing:1px}
#topright{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:center}
#topright button{pointer-events:auto;background:#1b2a35e8;color:var(--text);border:1px solid var(--line);min-width:42px;height:42px;font-weight:900}
#qualitylabel{font-size:10px;color:#c7b891;letter-spacing:1px}
#mission{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#c9d5d9;white-space:nowrap}
#msg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 90px);left:50%;transform:translateX(-50%);width:min(90vw,420px);text-align:center;font-size:12px;font-weight:bold;color:#e4c17c}
#bottomleft{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 15px);display:flex;gap:6px;align-items:end}
#hpbox,#armorbox{background:#12202bc9;border-bottom:3px solid var(--gold);padding:5px 12px;min-width:83px}#armorbox{border-color:#8cb7ce}
.hudlabel{display:block;color:#b7c3c7;font-size:9px;letter-spacing:2px;font-weight:700}.hudvalue{display:block;font-size:29px;font-weight:900;line-height:1.1}#hp{color:#f2e3c0}#armor{color:#b1d6e7}
#bottomright{position:absolute;right:calc(env(safe-area-inset-right,0px) + 15px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:end;gap:8px}
#weapon{background:#12202bdc;border-bottom:3px solid var(--gold);min-width:148px;padding:8px 12px;text-align:right}
#weapon .name{font-size:11px;font-weight:900;letter-spacing:2px}#weapon .ammo{font-size:28px;font-weight:900}#weapon .ammo small{font-size:12px;color:#9aaeb9}
#killfeed{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 155px);display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:46vw}#killfeed .entry{padding:6px 10px;background:#14212be8;border-left:3px solid var(--gold);font-size:11px;font-weight:800;color:#f2e5c9;animation:feedin .16s ease-out}@keyframes feedin{from{opacity:0;transform:translateX(15px)}to{opacity:1;transform:none}}#progress{height:3px;background:#253746;margin-top:5px}#progressfill{height:100%;width:0%;background:var(--gold);transition:width .2s}#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;transform:translate(-50%,-50%);opacity:.55}
#crosshair:before,#crosshair:after{content:'';position:absolute;background:#e4e9e9;box-shadow:0 0 2px #000}#crosshair:before{width:2px;height:20px;left:9px}#crosshair:after{height:2px;width:20px;top:9px}
#stick{position:fixed;z-index:4;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 94px);width:126px;height:126px;border:2px solid #8fa3b488;border-radius:50%;background:#16293770;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:#9cb6c4bd;border:2px solid #e2e9ec}
#dash{position:fixed;z-index:4;right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:88px;height:88px;border-radius:50%;background:#7c6139df;border:2px solid #e8bd74;color:white;font-size:12px;font-weight:900;box-shadow:0 0 0 6px #18263266}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101923;z-index:20;text-align:center;padding:30px}
@media(max-width:700px){#topbar{min-height:36px}#topbar .team{font-size:18px;padding:7px 10px;min-width:38px}#round{min-width:102px;padding:4px 5px}#round strong{font-size:13px}#round .mini{font-size:8px}#topright{right:6px;top:calc(env(safe-area-inset-top,0px) + 54px)}#topright button{height:34px;min-width:34px}#qualitylabel{display:none}#mission{top:calc(env(safe-area-inset-top,0px) + 47px);left:12px;transform:none;font-size:9px}#msg{top:calc(env(safe-area-inset-top,0px) + 83px)}#bottomleft{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}#bottomright{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}#hpbox,#armorbox{padding:4px 7px;min-width:58px}.hudvalue{font-size:23px}#weapon{min-width:108px;padding:5px 8px}#weapon .ammo{font-size:23px}#stick{bottom:calc(env(safe-area-inset-bottom,0px) + 78px);left:18px;width:112px;height:112px}#knob{left:33px;top:33px}#dash{right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);width:74px;height:74px}#crosshair{opacity:.3}#killfeed{top:calc(env(safe-area-inset-top,0px) + 125px)}#killfeed .entry{font-size:9px;padding:5px 7px}}
</style></head><body><div id="loading">ЗАГРУЗКА 3D-ДВИЖКА…</div><div id="hud"><div id="topbar"><span class="team blue">◆</span><div id="round"><span class="mini">ОПЕРАЦИЯ / ЗАЧИСТКА</span><strong id="kills">0 / 12</strong><div id="progress"><div id="progressfill"></div></div></div><span class="team gold">◆</span></div><div id="topright"><span id="qualitylabel">3D · TACTICAL</span><button id="pause3d" type="button" aria-label="Пауза">Ⅱ</button></div><div id="mission">ЦЕЛЬ: НЕЙТРАЛИЗОВАТЬ 12 ПРОТИВНИКОВ</div><div id="msg">Зачисти помещение. Стрельба автоматическая.</div><div id="killfeed" aria-live="polite"></div><div id="crosshair"></div><div id="bottomleft"><div id="hpbox"><span class="hudlabel">ЗДОРОВЬЕ</span><span class="hudvalue" id="hp">100</span></div><div id="armorbox"><span class="hudlabel">БРОНЯ</span><span class="hudvalue" id="armor">0</span></div></div><div id="bottomright"><div id="weapon"><span class="hudlabel">АВТОМАТИЧЕСКОЕ ОРУЖИЕ</span><div class="name">TACTICAL / MK-1</div><div class="ammo">∞ <small>/ AUTO</small></div></div></div></div><div id="stick"><div id="knob"></div></div><button id="dash">РЫВОК</button><script>
(function(){
 const loading=document.getElementById('loading');let completed=false;
 function fail(reason){
  if(completed||!loading||!loading.isConnected)return;
  completed=true;
  loading.innerHTML='';
  const panel=document.createElement('div');
  panel.style.cssText='max-width:380px;padding:22px;border:1px solid #9eacb9;background:#172633;color:#f4e6c7;font:15px/1.5 Arial,sans-serif';
  const title=document.createElement('h2');title.textContent='НЕ УДАЛОСЬ ЗАПУСТИТЬ 3D';title.style.color='#ffcb86';
  const detail=document.createElement('p');detail.textContent=reason;
  const retry=document.createElement('button');retry.textContent='ПОВТОРИТЬ';retry.style.cssText='padding:12px;margin:8px;background:#dca35b;color:#111';retry.onclick=()=>location.reload();
  panel.append(title,detail,retry);loading.append(panel);
 }
 window.addEventListener('error',e=>fail('Ошибка JavaScript: '+(e.message||'неизвестная ошибка')));
 window.addEventListener('unhandledrejection',e=>fail('Ошибка загрузки: '+String(e.reason&&e.reason.message||e.reason||'модуль недоступен')));
 const watchdog=setTimeout(()=>fail('3D-движок не ответил за 12 секунд. Установи обновлённую APK или повтори запуск.'),12000);
 import('./game3d.js').then(()=>{completed=true;clearTimeout(watchdog)}).catch(e=>{clearTimeout(watchdog);fail('Не удалось загрузить 3D-модуль: '+(e&&e.message||e))});
})();
</script></body></html>
