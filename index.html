<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c1d"><title>NEON SURVIVOR</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#080c1d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000}#hud span{background:#151d39cc;border:1px solid #52619c;border-radius:12px;padding:9px 12px}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070b18d9;backdrop-filter:blur(7px)}#panel{text-align:center;padding:30px 24px;border:1px solid #52619c;border-radius:22px;background:linear-gradient(150deg,#172345,#0c1024);width:min(90vw,370px);box-shadow:0 0 70px #2d8cff33}h1{font-size:30px;letter-spacing:2px;color:#72f9ff;margin:0 0 10px}p{color:#bac8e8;line-height:1.5}button{background:linear-gradient(90deg,#00d9e8,#8274ff);border:0;border-radius:14px;color:#071024;font-weight:900;padding:15px 38px;font-size:18px;cursor:pointer}small{display:block;margin-top:18px;color:#8292bd}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="hp">❤ 100</span><span id="score">★ 0</span><span id="time">00:00</span></div><div id="menu"><div id="panel"><h1 id="title">NEON SURVIVOR</h1><p id="desc">Выживай среди волн врагов. Перемещайся пальцем — стрельба автоматическая.</p><button id="start">ИГРАТЬ</button><small>HTML5 • Android • Offline</small></div></div><script src="game.js"></script></body></html>
