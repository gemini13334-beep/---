*{box-sizing:border-box}html,body{margin:0;background:#0b101b;color:#f2e8c9;font-family:monospace;overflow:hidden;touch-action:none}button{font:900 13px monospace;letter-spacing:.5px;color:#f7e7b7;background:#33445a;border:2px solid #7b8793;padding:12px;border-radius:3px;box-shadow:3px 3px 0 #080c15}button:active{transform:translate(2px,2px);box-shadow:1px 1px #080c15}button:disabled{opacity:.45}button.primary{background:#af643b;border-color:#eebc78;color:#fff2d0}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:fixed;top:env(safe-area-inset-top,8px);left:8px;right:8px;display:flex;gap:5px;align-items:center;justify-content:space-between;pointer-events:none;font:bold 12px monospace;text-shadow:1px 2px #000}#hud>span{background:#141d2bf2;border:2px solid #526074;padding:8px 7px;border-radius:5px;box-shadow:0 3px 0 #090d16}#hud button{pointer-events:auto;padding:8px}#overlay{position:fixed;inset:0;background:#080e19ed;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}#panel{background:repeating-linear-gradient(0deg,#1b2838 0px,#1b2838 4px,#1d2b3c 5px);border:4px solid #7a8c95;box-shadow:0 0 0 4px #0c111b,8px 8px #0008;width:min(95vw,470px);max-height:92dvh;overflow:auto;padding:18px;text-align:center}h1{color:#f8c66e;font-size:clamp(21px,6vw,32px);text-shadow:3px 3px #854c38;line-height:1.15;margin:10px 0 16px}h2{color:#f5c879;font-size:19px;margin:8px 0}p{line-height:1.6;color:#cbd0c7;font-size:13px}#actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.wide{grid-column:span 2}.card{background:#121d2b;border:2px solid #465c6a;padding:11px;margin:9px 0;text-align:left}.card b{color:#f2c578}.card small{color:#afbbba;display:block;margin:6px 0}.muted{color:#a7b5b5}#toast{position:fixed;top:65px;left:8%;right:8%;text-align:center;color:#f7d99c;font:bold 13px monospace;text-shadow:2px 2px #000;pointer-events:none}#touch{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));right /* Neon office: compact mobile HUD and premium tactical controls */
