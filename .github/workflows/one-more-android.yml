name: ONE MORE Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'one-more/**'
      - '.github/workflows/one-more-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Blender and generate models
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender -b -t 2 --python-exit-code 1 -P one-more/tools/generate_assets.py
          test -s one-more/assets/models/hero.glb
      - name: Install Godot and templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          curl -fL --retry 3 "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -fL --retry 3 "$base/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Configure Android
        run: |
          mkdir -p ~/.android ~/.config/godot
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME/.android/debug.keystore" > ~/.config/godot/editor_settings-4.4.tres
      - name: Import and export
        run: |
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$GODOT" --headless --path one-more --editor --import
          "$GODOT" --headless --path one-more --export-debug Android "$GITHUB_WORKSPACE/one-more.apk"
          test -s one-more.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ONE-MORE-Android
          path: one-more.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ONE-MORE-Blender-models
          path: one-more/assets/models/
          if-no-files-found: warn
