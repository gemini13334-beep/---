name: Build Godot 4 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/godot-apk.yml"
      - "godot/scripts/main.gd"
      - "godot/assets/textures/**"
      - "godot/assets/briefing/**"
      - "godot/assets/courtyard/**"
      - "godot/scripts/briefing.gd"
      - "godot/scripts/radar.gd"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Check Android build environment
        run: |
          godot --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          ls -la /root/.local/share/godot/export_templates/ || true
      - name: Configure Android SDK, templates and debug signing
        run: |
          set -eu
          export HOME=/root
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "HOME=/root" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          apt-get update -qq && apt-get install -y -qq curl unzip strace openjdk-17-jdk-headless ca-certificates >/dev/null
          mkdir -p /opt/android-sdk/cmdline-tools
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="/opt/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root=/opt/android-sdk --licenses >/dev/null || true
          sdkmanager --sdk_root=/opt/android-sdk "platform-tools" "platforms;android-33" "platforms;android-34" "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          mkdir -p /github/home/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable /github/home/.local/share/godot/export_templates/
          mkdir -p /github/home/.android
          keytool -genkeypair -v -keystore /github/home/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p /root/.config/godot /github/home/.config/godot /root/.android
          cp /github/home/.android/debug.keystore /root/.android/debug.keystore
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "/opt/android-sdk"\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\nexport/android/debug_keystore = "/root/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' > /root/.config/godot/editor_settings-4.3.tres
          cp /root/.config/godot/editor_settings-4.3.tres /github/home/.config/godot/editor_settings-4.3.tres
          ls -la /opt/android-sdk/build-tools /opt/android-sdk/platforms
          ls -la /root/.config/godot
          godot --headless --editor --path godot --quit >/tmp/godot-settings-check.log 2>&1 || true
          cat /tmp/godot-settings-check.log | tail -30
          echo "=== ACTUAL GODOT EDITOR SETTINGS ==="
          grep -E "export/android|debug_keystore|java_sdk" /root/.config/godot/editor_settings-4.3.tres || true
          echo "=== EXPORT TEMPLATES ==="
          ls -lh /root/.local/share/godot/export_templates/4.3.stable | head -30
      - name: Import project and check scripts
        run: |
          godot --headless --path godot --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log; then exit 1; fi
          godot --headless --path godot --quit-after 2
      - name: Export debug Android APK
        run: |
          mkdir -p godot/build
          echo "=== EXPORT PRESET ==="
          cat godot/export_presets.cfg
          echo "=== GODOT SETTINGS ==="
          grep -E "export/android|debug_keystore|java_sdk" /root/.config/godot/editor_settings-4.3.tres || true
          strace -f -e trace=file -o /tmp/godot-file-access.log godot --headless --verbose --path godot --export-debug "Android" build/Otpusk-Tactical-Godot.apk 2>&1 | tee /tmp/godot-export.log
          echo "=== MISSING ANDROID FILES (diagnostic only; loader probes may be harmless) ==="
          grep "ENOENT" /tmp/godot-file-access.log | grep -E "android|sdk|godot|keystore|java|build-tools|apk" | tail -70 || true
          if grep -E "Cannot export|Project export.*failed|ERROR:" /tmp/godot-export.log; then exit 1; fi
          test -s godot/build/Otpusk-Tactical-Godot.apk
      - name: Verify APK integrity and Android signature
        run: |
          set -eu
          APK="godot/build/Otpusk-Tactical-Godot.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -2
          APKSIGNER="/opt/android-sdk/build-tools/34.0.0/apksigner"
          AAPT="/opt/android-sdk/build-tools/34.0.0/aapt"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -12
          sha256sum "$APK"
      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: Otpusk-Tactical-Godot-APK
          path: godot/build/Otpusk-Tactical-Godot.apk

  publish:
    name: Publish direct APK download
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Otpusk-Tactical-Godot-APK
          path: dist
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/Otpusk-Tactical-Godot.apk
          gh release create "android-build-${{ github.run_number }}" dist/Otpusk-Tactical-Godot.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ОТПУСК TACTICAL — Android build ${{ github.run_number }}" --notes "Native Godot 4.3 Android debug APK. Download the APK file below and install on Android." --latest
