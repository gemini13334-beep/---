name: Build Godot Android APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['android-verify-*']
    paths:
      - '.github/workflows/godot-apk.yml'
      - '.github/scripts/android-smoke.sh'
      - 'godot/**'
      - 'tests/patrol.gd'
      - 'tests/story_wings.gd'
permissions:
  contents: read

env:
  PACKAGE: org.otpusk.tactical.game
  SIGNER_SHA256: d77e07cd1f65f7bf58a48c169716867f45c641ef88b0333bf002c6f9170b02a6
  APK: Osobyi-Otdel.apk

jobs:
  build:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          include-templates: true
          use-dotnet: false
      - name: Export universal Android package
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" dist
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME_17_X64" > "$HOME/.config/godot/editor_settings-4.5.tres"
          sed -i "s/^version\/code=.*/version\/code=$GITHUB_RUN_NUMBER/" godot/export_presets.cfg
          godot --headless --editor --path godot --import
          timeout 90s godot --headless --path godot --script "$PWD/tests/patrol.gd"
          timeout 90s godot --headless --path godot --script "$PWD/tests/story_wings.gd"
          godot --headless --path godot --export-release Android "$PWD/dist/unpacked.apk" 2>&1 | tee "$RUNNER_TEMP/export.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/export.log" || exit 1
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 dist/unpacked.apk "dist/$APK"
          rm dist/unpacked.apk
      - name: Sign when the release key is configured
        id: sign
        env:
          RELEASE_KEY: ${{ secrets.OTPUSK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OTPUSK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEY" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Unsigned export ready for the offline release signer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/otpusk.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$RELEASE_KEY" | base64 -d > "$key"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$key" --ks-key-alias otpusk --ks-pass env:STORE_PASSWORD "dist/$APK"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-export
          path: dist/Osobyi-Otdel.apk
          if-no-files-found: error

  install:
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/android-verify-') || needs.build.outputs.signed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_type != 'tag'
        uses: actions/download-artifact@v4
        with:
          name: android-export
          path: dist
      - name: Resolve release and verify exact APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          number=$GITHUB_RUN_NUMBER
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            number=${GITHUB_REF_NAME#android-verify-}
            [[ "$number" =~ ^[0-9]+$ ]]
            details=$(gh release view "android-build-$number" --json isDraft,targetCommitish)
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' <<< "$details"
            gh release download "android-build-$number" --pattern "$APK" --dir dist
          fi
          echo "RELEASE_TAG=android-build-$number" >> "$GITHUB_ENV"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          file="dist/$APK"
          unzip -tq "$file"
          "$tools/zipalign" -c -P 16 4 "$file"
          "$tools/apksigner" verify --verbose --print-certs "$file" | tee "$RUNNER_TEMP/cert"
          grep -Fx "Signer #1 certificate SHA-256 digest: $SIGNER_SHA256" "$RUNNER_TEMP/cert"
          "$tools/aapt" dump badging "$file" > "$RUNNER_TEMP/manifest"
          grep -F "name='$PACKAGE' versionCode='$number'" "$RUNNER_TEMP/manifest"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p "$file" "lib/$abi/libgodot_android.so" > "$RUNNER_TEMP/library"
            if [[ "$abi" == arm64-v8a ]]; then
              readelf -lW "$RUNNER_TEMP/library" | awk '$1=="LOAD"{print $NF}' > "$RUNNER_TEMP/alignments"
              while read -r alignment; do (( alignment >= 16384 )); done < "$RUNNER_TEMP/alignments"
            fi
          done
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
          python3 -c "from PIL import Image" || python3 -m pip install Pillow
      - name: Install, launch and update on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          profile: pixel_2
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-check
          path: device-check/
          if-no-files-found: ignore
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" "dist/$APK" --target "$GITHUB_SHA" --title "ОСОБЫЙ ОТДЕЛ — Android $GITHUB_RUN_NUMBER" --notes "Подписанный универсальный APK. Проверен на Android 14." --latest
          fi
