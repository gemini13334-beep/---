name: ONE MORE screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-more-screenshots.yml'
      - 'one-more/tests/capture.gd'
      - 'one-more/tools/generate_assets.py'
concurrency:
  group: one-more-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - run: bash one-more/tools/install_blender.sh
      - run: blender -b -t 2 --python-exit-code 1 -P one-more/tools/generate_assets.py
      - name: Import and capture the rendered game
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/one-more-capture-data
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p "$RUNNER_TEMP/screenshots"
          timeout 180s "$G" --headless --path one-more --editor --import 2>&1 | tee screenshot-import.log
          test "$(find one-more/.godot/imported -name '*.glb-*.scn' | wc -l)" -eq 28
          xvfb-run -a -s "-screen 0 1280x1600x24" timeout 120s "$G" --path one-more --audio-driver Dummy --resolution 720x1280 --script res://tests/capture.gd -- "$RUNNER_TEMP/screenshots" 2>&1 | tee screenshot-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load|Error importing|Shader compilation failed' screenshot-import.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' screenshot-capture.log; then exit 1; fi
          for frame in menu coop-lobby gameplay forest-ruins upgrade collection hero-titan hero-cryo awakening quests gates settings settings-video settings-audio city desert ice volcano; do
            test -s "$RUNNER_TEMP/screenshots/$frame.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ONE-MORE-screenshot-logs
          path: screenshot-*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ONE-MORE-actual-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error
