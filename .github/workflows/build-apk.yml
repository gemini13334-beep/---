name: Build Neon Survivor APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript syntax
        run: |
          node --check game3d.js
      - name: Copy HTML game to Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html 3d.html game3d.js app/src/main/assets/
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --retry 3 --silent --show-error https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js -o app/src/main/assets/vendor/three.module.js
          test $(wc -c < app/src/main/assets/vendor/three.module.js) -gt 100000
          curl --fail --location --retry 3 --silent --show-error https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js -o app/src/main/assets/vendor/GLTFLoader.js
          sed -i "s|from 'three'|from './three.module.js'|g" app/src/main/assets/vendor/GLTFLoader.js
          mkdir -p app/src/main/assets/models
          cp models/*.gltf app/src/main/assets/models/
          test -s app/src/main/assets/vendor/GLTFLoader.js
          test -s app/src/main/assets/models/hero.gltf
          node -e "for(const f of ['hero','enemy','crate']) {const p=JSON.parse(require('fs').readFileSync('app/src/main/assets/models/'+f+'.gltf','utf8'));if(p.asset.version!=='2.0'||!p.buffers[0].uri.startsWith('data:'))throw Error('Invalid embedded glTF '+f)}"
          node -e "const fs=require('fs');const js=fs.readFileSync('app/src/main/assets/vendor/GLTFLoader.js','utf8');if(/from ['\"]three['\"]/.test(js))throw Error('GLTFLoader has unresolved bare imports');if(!js.includes('./three.module.js'))throw Error('GLTFLoader local import missing')"
          test -s app/src/main/assets/game3d.js
          npx --yes esbuild@0.25.12 app/src/main/assets/game3d.js --bundle --format=iife --target=chrome90 --outfile=app/src/main/assets/game3d.bundle.js
          node --check app/src/main/assets/game3d.bundle.js
          test $(wc -c < app/src/main/assets/game3d.bundle.js) -gt 100000
          node - <<'NODE'
          const fs=require('fs');
          const path='app/src/main/assets/3d.html';
          let html=fs.readFileSync(path,'utf8');
          const old="import('./game3d.js').then(()=>{completed=true;clearTimeout(watchdog)}).catch(e=>{clearTimeout(watchdog);fail('Не удалось загрузить 3D-модуль: '+(e&&e.message||e))});";
          if(!html.includes(old))throw Error('Expected module loader not found');
          const replacement="const script=document.createElement('script');script.src='./game3d.bundle.js';script.onload=()=>{if(!completed){completed=true;clearTimeout(watchdog)}};script.onerror=()=>{clearTimeout(watchdog);fail('Не удалось загрузить 3D-движок. Переустанови APK.')};document.body.append(script);";
          html=html.replace(old,replacement);
          fs.writeFileSync(path,html);
          if(html.includes("import('./game3d.js')"))throw Error('Module loader remains in Android HTML');
          NODE
          ! grep -R -q 'classic.html' app/src/main/assets/3d.html app/src/main/assets/game3d.js
          if [ -d assets ]; then cp -R assets app/src/main/assets/; fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NeonSurvivor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
