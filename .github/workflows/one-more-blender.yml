name: ONE MORE Blender Assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'one-more/tools/*.py'
      - 'one-more/tools/install_blender.sh'
      - '.github/workflows/one-more-blender.yml'
concurrency:
  group: one-more-blender-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          bash one-more/tools/install_blender.sh
      - name: Generate and verify
        run: |
          blender -b -t 2 --python-exit-code 1 -P one-more/tools/generate_assets.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          import struct
          root=Path("one-more/assets/models")
          heroes = "hero cyborg inferno ghost titan cryo".split()
          operators = "vega fox amber north".split()
          equipment = "enemy enemy_fast enemy_armored boss_overlord boss_crystal boss_inferno buggy hovercraft tank mech crate".split()
          scenery = "forest city desert ice volcano tree rock ruin cactus ice_spire lava_vent".split()
          for name in heroes + operators + equipment + scenery:
              glb=root/(name+".glb")
              blend=root/(name+".blend")
              assert blend.stat().st_size>0, name
              with glb.open("rb") as f:
                  magic,version,length=struct.unpack("<4sII",f.read(12))
                  json_size,chunk=struct.unpack("<I4s",f.read(8))
                  assert chunk == b"JSON", name
                  document=json.loads(f.read(json_size))
              assert magic==b"glTF" and version==2 and length==glb.stat().st_size,name
              assert any(mesh.get("primitives") for mesh in document["meshes"]), name
              if name in heroes + operators + equipment:
                  assert document.get("textures"), name
              if name in heroes:
                  markers = [node for node in document["nodes"] if node.get("name") == "ShotOrigin"]
                  assert len(markers) == 1 and "translation" in markers[0], name
              if name in operators:
                  assert len(document.get("skins", [])) == 1, name
                  assert any(node.get("name") == "Muzzle" for node in document["nodes"]), name
                  clips = {clip["name"]: clip for clip in document.get("animations", [])}
                  assert set(clips) == {"Idle", "Walk", "Run", "Fire", "Hit", "Fall"}, name
                  assert all(clip.get("channels") for clip in clips.values()), name
                  assert 0 < sum(len(mesh["primitives"]) for mesh in document["meshes"]) <= 16, name
              print(name,glb.stat().st_size,blend.stat().st_size)
          PY
      - name: Render model previews
        run: |
          blender -b -t 2 --python-exit-code 1 -P one-more/tools/generate_assets.py -- --preview
          test "$(find one-more/assets/models/previews -name '*.png' -type f -size +0c | wc -l)" -eq 32
      - uses: actions/upload-artifact@v4
        with:
          name: ONE-MORE-Verified-Blender-Assets
          path: |
            one-more/assets/models/*.glb
            one-more/assets/models/*.blend
            one-more/assets/models/previews/*.png
          if-no-files-found: error
