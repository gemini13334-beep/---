name: Godot 4 Android Port Validation
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          include-templates: false
          use-dotnet: false
      - name: Import Godot project
        run: godot --headless --path godot --editor --import
      - name: Validate scene and scripts
        run: |
          set -eu
          godot --headless --path godot --editor --quit 2>&1 | tee /tmp/godot-check.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-check.log; then exit 1; fi
          godot --headless --path godot --quit-after 3 2>&1 | tee /tmp/godot-runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-runtime.log; then exit 1; fi
