name: ONE MORE validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'one-more/**'
      - '.github/workflows/one-more-validate.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import and smoke test
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path one-more --editor --import
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path one-more --quit-after 120
